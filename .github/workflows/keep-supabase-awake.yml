name: Keep Supabase awake

on:
  schedule:
    - cron: '0 6 */3 * *' # every 3 days, well under Supabase's 7-day pause window
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the Supabase REST API
        run: |
          curl -sf "https://fkqgideqtqumtbtduvik.supabase.co/rest/v1/categories?select=code&limit=1" \
            -H "apikey: sb_publishable_SHn12KK7E2uER39mHZT9_A_373yN_ie"
