<!doctype html>
<html lang="en-GB" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <!-- Browsers cache the tab favicon by its exact URL, separately from everything else on the
         page — a new deploy with the same filename can still show the old icon indefinitely. The
         "?v=" here forces it to be treated as a different resource whenever it actually changes;
         bump it only when the icon file itself changes, not on every deploy. -->
    <link rel="icon" type="image/png" href="/icons/icon-192.png?v=5" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f0f5ec" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b3d36" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="See it. Report it. Resolve it. Report local problems, follow them to the end, and see whether they were really fixed." />
    <script src="/theme-init.js"></script>
    <title>Resolve UK · See it. Report it. Resolve it.</title>
  </head>
  <body>
    <!-- What shows the instant the page opens, before the app's code has loaded: the header and a
         page in soft shimmering shapes (styles: .boot in src/index.css). React replaces it all as
         soon as it starts. -->
    <div id="root"><div class="boot" aria-hidden="true"><div class="boot-bar"><span class="skeleton boot-logo"></span><span class="skeleton boot-btn"></span><span class="skeleton boot-btn"></span></div><div class="boot-body"><span class="skeleton boot-l" style="width:7rem"></span><span class="skeleton boot-h" style="width:85%"></span><span class="skeleton boot-h" style="width:60%"></span><span class="skeleton boot-l" style="width:95%;margin-top:.6rem"></span><span class="skeleton boot-l" style="width:88%"></span><span class="skeleton boot-l" style="width:70%"></span><span class="skeleton boot-card"></span><span class="skeleton boot-card"></span></div></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
