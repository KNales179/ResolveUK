<!doctype html>
<html lang="en-GB" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <!-- Browsers cache the tab favicon by its exact URL, separately from everything else on the
         page — a new deploy with the same filename can still show the old icon indefinitely. The
         "?v=" here forces it to be treated as a different resource whenever it actually changes;
         bump it only when the icon file itself changes, not on every deploy. -->
    <link rel="icon" type="image/png" href="/icons/icon-192.png?v=4" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f0f5ec" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b3d36" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="See it. Report it. Resolve it. Report local problems, follow them to the end, and see whether they were really fixed." />
    <script src="/theme-init.js"></script>
    <title>Resolve UK · See it. Report it. Resolve it.</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
